[project]
name = "trst"
version = "0.1.0"
description = "A friendlier sed alternative for replacing patterns in text streams"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.scripts]
trst = "trst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trst"]

[tool.ruff]
line-length = 99

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]
